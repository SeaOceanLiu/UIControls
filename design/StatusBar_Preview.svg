<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440">
  <defs>
    <marker id="arrowBlueUp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,6 L8,3 L0,0 Z" fill="#2196F3"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4CAF50"/>
    </marker>
  </defs>

  <!-- ============ 窗口场景 ============ -->
  <rect x="0" y="0" width="640" height="400" fill="#2B2B2B"/>
  <rect x="0" y="0" width="640" height="28" fill="#323232"/>
  <text x="14" y="19" font-size="12" fill="#CCCCCC" font-family="sans-serif">示例窗口</text>

  <!-- 代码区示意 -->
  <text x="30" y="70" font-size="13" fill="#8F8F8F" font-family="monospace">#include &lt;iostream&gt;</text>
  <text x="30" y="95" font-size="13" fill="#8F8F8F" font-family="monospace">int main() {</text>
  <text x="46" y="120" font-size="13" fill="#8F8F8F" font-family="monospace">std::cout &lt;&lt; "hi";</text>
  <text x="30" y="145" font-size="13" fill="#8F8F8F" font-family="monospace">}</text>

  <!-- ============ StatusBar（底部） ============ -->
  <rect x="0" y="360" width="640" height="40" fill="#007ACC"/>
  <line x1="0" y1="360" x2="640" y2="360" stroke="#000000" stroke-width="1" opacity="0.3"/>

  <!-- left 组 -->
  <!-- main：leadingControl 容器（边长 18 = 字号 13×1.4）+ 分支图标 -->
  <rect x="16" y="371" width="18" height="18" rx="3" fill="#2D2D30" stroke="#454545"/>
  <circle cx="25" cy="377" r="2.5" fill="#9CDCFE"/>
  <line x1="25" y1="380" x2="25" y2="386" stroke="#9CDCFE" stroke-width="1"/>
  <text x="40" y="385" font-size="13" fill="#FFFFFF" font-family="sans-serif">main</text>
  <!-- 0 错误：无前缀，不留白 -->
  <text x="76" y="385" font-size="13" fill="#FFFFFF" font-family="sans-serif">0 错误</text>

  <!-- right 组（从右缘向左） -->
  <text x="588" y="385" font-size="13" fill="#FFFFFF" font-family="sans-serif">UTF-8</text>
  <text x="520" y="385" font-size="13" fill="#FFFFFF" font-family="sans-serif">行 12, 列 34</text>
  <text x="494" y="385" font-size="13" fill="#FFFFFF" font-family="sans-serif">C++</text>
  <line x1="488" y1="368" x2="488" y2="392" stroke="#FFFFFF" stroke-width="1" opacity="0.35"/>
  <!-- 同步中…：动画控件前缀（旋转环示意） -->
  <rect x="410" y="371" width="18" height="18" rx="3" fill="#2D2D30" stroke="#454545"/>
  <path d="M419,374.5 A5.5,5.5 0 1 1 414.5,379" fill="none" stroke="#9CDCFE" stroke-width="1.5"/>
  <path d="M412.5,377 L414.5,380 L417,377 Z" fill="#9CDCFE"/>
  <text x="434" y="385" font-size="13" fill="#FFFFFF" font-family="sans-serif">同步中…</text>
  <line x1="404" y1="368" x2="404" y2="392" stroke="#FFFFFF" stroke-width="1" opacity="0.35"/>

  <!-- ============ 点击点（main 项） ============ -->
  <circle cx="52" cy="380" r="4" fill="#F44336" stroke="#FFFFFF" stroke-width="1"/>

  <!-- ============ 标注：leadingControl ============ -->
  <line x1="25" y1="354" x2="25" y2="370" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="40" y="354" font-size="11" fill="#4CAF50" font-family="sans-serif">leadingControl 容器（边长 = 字号×1.4）</text>
  <line x1="419" y1="354" x2="419" y2="370" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="434" y="354" font-size="11" fill="#4CAF50" font-family="sans-serif">动画控件前缀（LuotiAni / 用户自建）</text>

  <!-- ============ 向上弹出的菜单（面板底缘 360 贴 item 顶缘 360） ============ -->
  <rect x="16" y="211" width="190" height="149" rx="5" fill="#252526" stroke="#454545"/>

  <!-- 项1 切换分支：leadingControl 容器（icon 区，边长 = 行字号高）+ 分支图标 -->
  <rect x="16" y="217" width="21" height="21" rx="4" fill="#2D2D30" stroke="#454545"/>
  <circle cx="26" cy="227" r="3" fill="#9CDCFE"/>
  <line x1="26" y1="230" x2="26" y2="236" stroke="#9CDCFE" stroke-width="1"/>
  <text x="42" y="232" font-size="15" fill="#CCCCCC" font-family="sans-serif">切换分支</text>
  <!-- 项2 新建分支 -->
  <text x="36" y="264" font-size="15" fill="#CCCCCC" font-family="sans-serif">新建分支</text>
  <!-- 分隔线 -->
  <line x1="26" y1="286" x2="196" y2="286" stroke="#454545" stroke-width="1"/>
  <!-- 项3 拉取(Pull)…：hover 高亮 + 子菜单箭头 -->
  <rect x="16" y="296" width="190" height="32" fill="#094771"/>
  <text x="36" y="317" font-size="15" fill="#CCCCCC" font-family="sans-serif">拉取(Pull)…</text>
  <path d="M182.7,308 L182.7,316 L189.3,312 Z" fill="#CCCCCC"/>

  <!-- ============ 标注：向上弹出 ============ -->
  <line x1="210" y1="358" x2="210" y2="218" stroke="#2196F3" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowBlueUp)"/>
  <text x="216" y="212" font-size="11" fill="#2196F3" font-family="sans-serif">向上弹出：面板底缘贴 item 顶缘</text>

  <!-- ============ 右侧说明 ============ -->
  <text x="400" y="80" font-size="11" fill="#9E9E9E" font-family="sans-serif">弹窗复用 MenuPanel（hover/子菜单/icon 容器/变行高）</text>
  <text x="400" y="98" font-size="11" fill="#9E9E9E" font-family="sans-serif">顶部越界 → 钳制（窗口矮场景，不超出窗口顶）</text>
  <text x="400" y="116" font-size="11" fill="#9E9E9E" font-family="sans-serif">Esc：后续随 Menu 键盘导航一起实现</text>
  <text x="400" y="134" font-size="11" fill="#9E9E9E" font-family="sans-serif">JSON / CABI / C++ Binding：一期（ContextMenu 先例）</text>
  <text x="400" y="152" font-size="11" fill="#9E9E9E" font-family="sans-serif">子菜单向右展开（现状限制，无右缘钳制）</text>
  <text x="400" y="170" font-size="11" fill="#9E9E9E" font-family="sans-serif">leadingControl 在 StatusBar 条上（非弹窗菜单项）：图标/动画可嵌，无则不留白</text>

  <!-- ============ 底部：分组标注 ============ -->
  <line x1="16" y1="414" x2="110" y2="414" stroke="#4CAF50" stroke-width="1.5" marker-start="url(#arrowGreen)"/>
  <text x="16" y="432" font-size="12" fill="#4CAF50" font-family="sans-serif">left 组</text>
  <line x1="492" y1="414" x2="624" y2="414" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="492" y="432" font-size="12" fill="#4CAF50" font-family="sans-serif">right 组（右缘向左排）</text>
</svg>