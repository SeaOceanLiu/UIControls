<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580">
  <!-- ============ 象限标题 ============ -->
  <text x="30" y="20" font-size="14" fill="#4CAF50" font-family="sans-serif" font-weight="bold">Top（缺省）</text>
  <text x="420" y="20" font-size="14" fill="#4CAF50" font-family="sans-serif" font-weight="bold">Bottom</text>
  <text x="30" y="305" font-size="14" fill="#4CAF50" font-family="sans-serif" font-weight="bold">Left</text>
  <text x="420" y="305" font-size="14" fill="#4CAF50" font-family="sans-serif" font-weight="bold">Right</text>

  <!-- ============ 象限1：Top ============ -->
  <rect x="30" y="30" width="360" height="240" fill="#2B2B2B" stroke="#454545"/>
  <rect x="30" y="30" width="360" height="30" fill="#3C3C3C"/>
  <rect x="30" y="60" width="360" height="210" fill="#1E1E1E"/>
  <line x1="30" y1="60" x2="390" y2="60" stroke="#454545" stroke-width="1"/>
  <!-- 主页（选中） -->
  <rect x="30" y="30" width="72" height="30" fill="#252526"/>
  <rect x="30" y="57" width="72" height="3" fill="#007ACC"/>
  <text x="46" y="50" font-size="12" fill="#FFFFFF" font-family="sans-serif">主页</text>
  <!-- 设置 -->
  <text x="118" y="50" font-size="12" fill="#9E9E9E" font-family="sans-serif">设置</text>
  <!-- 日志（leadingControl 圆点） -->
  <circle cx="180" cy="45" r="3" fill="#E8A33D"/>
  <text x="190" y="50" font-size="12" fill="#9E9E9E" font-family="sans-serif">日志</text>
  <text x="60" y="140" font-size="13" fill="#8F8F8F" font-family="sans-serif">主页内容</text>

  <!-- ============ 象限2：Bottom ============ -->
  <rect x="420" y="30" width="360" height="240" fill="#2B2B2B" stroke="#454545"/>
  <rect x="420" y="30" width="360" height="210" fill="#1E1E1E"/>
  <line x1="420" y1="240" x2="780" y2="240" stroke="#454545" stroke-width="1"/>
  <rect x="420" y="240" width="360" height="30" fill="#3C3C3C"/>
  <!-- 主页（选中，指示条贴上缘） -->
  <rect x="420" y="240" width="72" height="30" fill="#252526"/>
  <rect x="420" y="240" width="72" height="3" fill="#007ACC"/>
  <text x="436" y="260" font-size="12" fill="#FFFFFF" font-family="sans-serif">主页</text>
  <text x="508" y="260" font-size="12" fill="#9E9E9E" font-family="sans-serif">设置</text>
  <text x="580" y="260" font-size="12" fill="#9E9E9E" font-family="sans-serif">日志</text>
  <text x="450" y="140" font-size="13" fill="#8F8F8F" font-family="sans-serif">主页内容</text>

  <!-- ============ 象限3：Left ============ -->
  <rect x="30" y="315" width="360" height="240" fill="#2B2B2B" stroke="#454545"/>
  <rect x="30" y="315" width="90" height="240" fill="#3C3C3C"/>
  <rect x="120" y="315" width="270" height="240" fill="#1E1E1E"/>
  <line x1="120" y1="315" x2="120" y2="555" stroke="#454545" stroke-width="1"/>
  <!-- 主页（选中，指示条贴右缘） -->
  <rect x="30" y="315" width="90" height="32" fill="#252526"/>
  <rect x="117" y="315" width="3" height="32" fill="#007ACC"/>
  <text x="40" y="335" font-size="12" fill="#FFFFFF" font-family="sans-serif">主页</text>
  <text x="40" y="367" font-size="12" fill="#9E9E9E" font-family="sans-serif">设置</text>
  <circle cx="40" cy="391" r="3" fill="#E8A33D"/>
  <text x="50" y="399" font-size="12" fill="#9E9E9E" font-family="sans-serif">日志</text>
  <text x="160" y="435" font-size="13" fill="#8F8F8F" font-family="sans-serif">主页内容</text>

  <!-- ============ 象限4：Right ============ -->
  <rect x="420" y="315" width="360" height="240" fill="#2B2B2B" stroke="#454545"/>
  <rect x="420" y="315" width="270" height="240" fill="#1E1E1E"/>
  <line x1="690" y1="315" x2="690" y2="555" stroke="#454545" stroke-width="1"/>
  <rect x="690" y="315" width="90" height="240" fill="#3C3C3C"/>
  <!-- 主页（选中，指示条贴左缘） -->
  <rect x="690" y="315" width="90" height="32" fill="#252526"/>
  <rect x="690" y="315" width="3" height="32" fill="#007ACC"/>
  <text x="700" y="335" font-size="12" fill="#FFFFFF" font-family="sans-serif">主页</text>
  <text x="700" y="367" font-size="12" fill="#9E9E9E" font-family="sans-serif">设置</text>
  <text x="700" y="399" font-size="12" fill="#9E9E9E" font-family="sans-serif">日志</text>
  <text x="460" y="435" font-size="13" fill="#8F8F8F" font-family="sans-serif">主页内容</text>

  <!-- ============ 指示条方向标注 ============ -->
  <text x="30" y="285" font-size="11" fill="#2196F3" font-family="sans-serif">选中指示条贴下缘</text>
  <text x="420" y="285" font-size="11" fill="#2196F3" font-family="sans-serif">选中指示条贴上缘</text>
  <text x="30" y="570" font-size="11" fill="#2196F3" font-family="sans-serif">选中指示条贴右缘</text>
  <text x="420" y="570" font-size="11" fill="#2196F3" font-family="sans-serif">选中指示条贴左缘</text>
</svg>