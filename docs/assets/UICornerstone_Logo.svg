<?xml version="1.0" encoding="UTF-8"?>
<!-- UICornerstone Logo v2（极简）— 基石叠层：渐变底块 → 白色窗口 → 青色控件条 -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 背景：深蓝 → 紫色对角渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1550"/>
      <stop offset="0.55" stop-color="#3b1e8e"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- 控件条：亮青 -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- 底块 -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bgGrad)"/>

  <!-- 白色窗口块 -->
  <rect x="168" y="176" width="176" height="160" rx="24" fill="#ffffff"/>

  <!-- 青色控件条 -->
  <rect x="208" y="238" width="96" height="36" rx="18" fill="url(#barGrad)"/>
</svg>
